      function handleFirestoreError(error, operationType, path) {
        const errInfo = {
          error: error instanceof Error ? error.message : String(error),
          authInfo: {
            userId: auth.currentUser?.uid,
            email: auth.currentUser?.email,
            emailVerified: auth.currentUser?.emailVerified,
            isAnonymous: auth.currentUser?.isAnonymous,
            tenantId: auth.currentUser?.tenantId,
            providerInfo:
              auth.currentUser?.providerData?.map((provider) => ({
                providerId: provider.providerId,
                email: provider.email,
              })) || [],
          },
          operationType,
          path,
        };
        console.error('Firestore Error: ', JSON.stringify(errInfo));
        throw new Error(JSON.stringify(errInfo));
      }

      async function testConnection() {
        try {
          await getDocFromServer(doc(db, 'test', 'connection'));
        } catch (error) {
          if (
            error instanceof Error &&
            error.message.includes('the client is offline')
          ) {
            await new Promise((resolve) => setTimeout(resolve, 1500));
            try {
              await getDocFromServer(doc(db, 'test', 'connection'));
            } catch (retryError) {
              if (
                retryError instanceof Error &&
                retryError.message.includes('the client is offline')
              ) {
                console.error('Please check your Firebase configuration.');
              }
            }
          }
        }

      // =========================================================

      function generateSimulatedCrashPoint() {
        const r = Math.random();
        if (r < 0.04) {
          return Number((1.0 + Math.random() * 0.08).toFixed(2));
        }
        const raw = 0.97 / (1 - r);
        const clamped = Math.min(Math.max(raw, 1.05), 48.0);
        return Number(clamped.toFixed(2));
      }

      function generateRoundSeed() {
        const chars = '0123456789abcdef';
        let out = '';
        for (let i = 0; i < 12; i++) {
          out += chars[Math.floor(Math.random() * chars.length)];
        }
        return out;
      }

      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }
        getContext() {
          if (!this.enabled || typeof window === 'undefined') return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }
        playSignalReady() {
          const ctx = this.getContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.14);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.18);
        }
        playSuccess() {
          const ctx = this.getContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          [587.33, 880].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.07, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.2);
          });
        }
        playCrash() {
          const ctx = this.getContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(65, now + 0.25);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        }
      }

      const soundEngine = new SoundEngine();

      // =========================================================
      // 3. State Management & Real-time Database Sync
      // =========================================================
      const STORAGE_KEY = 'aviator_radar_store_v1';
      const ORDERS_STORAGE_KEY = 'aviator_orders_requests_v1';
      const OWNER_PIN_HASH = '1822491432';

      function fnv1aHash(str) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619) >>> 0;
        }
        return String(h);
      }

      function getSourceAppLabel() {
        if (typeof window === 'undefined') return 'web';
        const host = window.location.hostname || window.location.protocol || 'web';
        return host.slice(0, 150);
      }

      function mergeById(cloudItems, localItems, getDate) {
        const map = new Map();
        for (const local of localItems) {
          if (local && local.id) map.set(local.id, local);
        }
        for (const cloud of cloudItems) {
          if (cloud && cloud.id) {
            const existingLocal = map.get(cloud.id);
            map.set(cloud.id, existingLocal ? { ...existingLocal, ...cloud } : cloud);
          }
        }
        return Array.from(map.values()).sort((a, b) =>
          getDate(b).localeCompare(getDate(a))
        );
      }

      function writeOrdersSnapshotToStorage(next) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          localStorage.setItem(
            ORDERS_STORAGE_KEY,
            JSON.stringify({
              registrationRequests: next.registrationRequests,
              topUpRequests: next.topUpRequests,
              withdrawRequests: next.withdrawRequests,
              updatedAt: new Date().toISOString(),
            })
          );
        } catch {
          // ignore quota limits
        }
      }

        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return buildInitialState();
          const parsed = JSON.parse(raw);
          if (!parsed.accounts || parsed.accounts.length === 0) {
            return buildInitialState();
          }
          const migratedAccounts = parsed.accounts.map((acc) => ({
            ...acc,
            password: acc.password || '',
            passwordHash: acc.passwordHash || fnv1aHash(acc.password || '1234'),
          }));
          const seenRoundNumbers = new Set();
          const uniqueRounds = (Array.isArray(parsed.rounds) ? parsed.rounds : []).filter(
            (r) => {
              if (seenRoundNumbers.has(r.roundNumber)) return false;
              seenRoundNumbers.add(r.roundNumber);
              return true;
            }
          );
          const resolvedPinHash =
            parsed.adminPinHash ||
            (parsed.adminPin && parsed.adminPin !== '2026'
              ? fnv1aHash(parsed.adminPin)
              : OWNER_PIN_HASH);

          return {
            ...parsed,
            accounts: migratedAccounts,
            registrationRequests: Array.isArray(parsed.registrationRequests)
              ? parsed.registrationRequests
              : [],
            withdrawRequests: Array.isArray(parsed.withdrawRequests)
              ? parsed.withdrawRequests
              : [],
            rounds: uniqueRounds,
            adminPinHash: resolvedPinHash,
            sessionRole: parsed.sessionRole ?? null,
            activeUserId: parsed.sessionRole ? parsed.activeUserId : null,
          };
        } catch {
          return buildInitialState();
        }
      }

      async function ensureAccountInFirestore(account) {
        const path = `accounts/${account.id}`;
        const docRef = doc(db, 'accounts', account.id);
        try {
          const snap = await getDoc(docRef);
          if (!snap.exists()) {
            await setDoc(docRef, {
              id: account.id,
              name: account.name.slice(0, 100),
              phone: account.phone.slice(0, 30),
              passwordHash: (
                account.passwordHash || fnv1aHash(account.password || '1234')
              ).slice(0, 128),
              balance: 0,
              isFrozen: false,
              createdAt: account.createdAt.slice(0, 64),
              syncedAt: serverTimestamp(),
            });
          }
        } catch (error) {
          handleFirestoreError(error, OperationType.WRITE, path);
        }
      }

      async function syncAccountBalanceToFirestore(
        account,
        nextBalance,
        nextFrozen
      ) {
        const path = `accounts/${account.id}`;
        try {
          await ensureAccountInFirestore(account);
          await updateDoc(doc(db, 'accounts', account.id), {
            balance: Math.max(0, Math.min(10000000, Math.round(nextBalance))),
            isFrozen: Boolean(nextFrozen),
            syncedAt: serverTimestamp(),
          });
        } catch (error) {
          handleFirestoreError(error, OperationType.UPDATE, path);
        }
      }

      async function syncAuditLogToFirestore(entry) {
        const path = `auditLog/${entry.id}`;
        try {
          const payload = {
            id: entry.id,
            action: entry.action,
            targetUserName: entry.targetUserName.slice(0, 100),
            details: entry.details.slice(0, 400),
            timestamp: entry.timestamp.slice(0, 64),
            syncedAt: serverTimestamp(),
          };
          if (typeof entry.amount === 'number' && Number.isFinite(entry.amount)) {
            payload.amount = entry.amount;
          }
          await setDoc(doc(db, 'auditLog', entry.id), payload);
        } catch (error) {
          handleFirestoreError(error, OperationType.CREATE, path);
        }
      }

      function useAppStore() {
        const [state, setState] = useState(() => loadState());
        const [isAdminUnlocked, setIsAdminUnlocked] = useState(
          () => loadState().sessionRole === 'admin'
        );
        const stateRef = useRef(state);

        useEffect(() => {
          stateRef.current = state;
          writeOrdersSnapshotToStorage(state);
        }, [state]);

        useEffect(() => {
          const handleStorage = (e) => {
            if (e.key === STORAGE_KEY || e.key === ORDERS_STORAGE_KEY) {
              setState(loadState());
            }
          };
          window.addEventListener('storage', handleStorage);
          return () => window.removeEventListener('storage', handleStorage);
        }, []);

        useEffect(() => {
          const topUpQuery = query(
            collection(db, 'topUpRequests'),
            orderBy('createdAt', 'desc')
          );
          const unsubTopUp = onSnapshot(
            topUpQuery,
            (snapshot) => {
              const cloudTopUps = snapshot.docs.map((d) => {
                const data = d.data();
                return {
                  id: data.id || d.id,
                  userId: data.userId,
                  userName: data.userName,
                  amount: Number(data.amount),
                  method: data.method,
                  referenceCode: data.referenceCode,
                  senderPhone: data.senderPhone,
                  receiptImage: data.receiptImage,
                  receiptFileName: data.receiptFileName,
                  note: data.note,
                  status: data.status,
                  sourceApp: data.sourceApp,
                  createdAt: data.createdAt,
                  reviewedAt: data.reviewedAt,
                  rejectionReason: data.rejectionReason,
                };
              });
              setState((prev) => ({
                ...prev,
                topUpRequests: mergeById(
                  cloudTopUps,
                  prev.topUpRequests,
                  (item) => item.createdAt
                ),
              }));
            },
            (error) => {
              handleFirestoreError(error, OperationType.LIST, 'topUpRequests');
            }
          );

          const withdrawQuery = query(
            collection(db, 'withdrawRequests'),
            orderBy('createdAt', 'desc')
          );
          const unsubWithdraw = onSnapshot(
            withdrawQuery,
            (snapshot) => {
              const cloudWithdraws = snapshot.docs.map((d) => {
                const data = d.data();
                return {
                  id: data.id || d.id,
                  userId: data.userId,
                  userName: data.userName,
                  amount: Number(data.amount),
                  method: data.method,
                  destinationPhone: data.destinationPhone,
                  note: data.note,
                  status: data.status,
                  createdAt: data.createdAt,
                  reviewedAt: data.reviewedAt,
                  rejectionReason: data.rejectionReason,
                };
              });
              setState((prev) => ({
                ...prev,
                withdrawRequests: mergeById(
                  cloudWithdraws,
                  prev.withdrawRequests,
                  (item) => item.createdAt
                ),
              }));

            (error) => {
              handleFirestoreError(error, OperationType.LIST, 'withdrawRequests');

          );

          const accountsQuery = query(
            collection(db, 'accounts'),
            orderBy('createdAt', 'desc')
          );
          const unsubAccounts = onSnapshot(
            accountsQuery,
            (snapshot) => {
              const cloudAccounts = snapshot.docs.map((d) => {
                const data = d.data();
                return {
                  id: data.id || d.id,
                  name: data.name,
                  phone: data.phone,
                  password: data.password || '',
                  passwordHash: data.passwordHash,
                  balance: Number(data.balance ?? 0),
                  isFrozen: Boolean(data.isFrozen),
                  createdAt: data.createdAt,
                };
              });
              setState((prev) => {
                const mergedAccounts = mergeById(
                  cloudAccounts.map((ca) => {
                    const existing = prev.accounts.find((la) => la.id === ca.id);
                    return {
                      ...ca,
                      password: existing?.password || ca.password || '',
                    };
                  }),
                  prev.accounts,
                  (item) => item.createdAt
                );
                return { ...prev, accounts: mergedAccounts };
              });
            },
            (error) => {
              handleFirestoreError(error, OperationType.LIST, 'accounts');

          const regQuery = query(
            collection(db, 'registrationRequests'),
            orderBy('createdAt', 'desc')

            (snapshot) => {

                  prev.registrationRequests,
                  (item) => item.createdAt
                ),
              }));

                error,
                OperationType.LIST,
                'registrationRequests'

          );

          const auditQuery = query(
            collection(db, 'auditLog'),

            auditQuery,
            (snapshot) => {

                  action: data.action,

              if (targetAccount) {
                await syncAccountBalanceToFirestore(
                  targetAccount,
                  nextBalance,
                  targetAccount.isFrozen
                );
              }
              await syncAuditLogToFirestore(entry);
            })();

            return { ok: true };
          },
          [isAdminUnlocked]
        );

        const toggleFreezeAccount = useCallback(
          (userId) => {
            if (!isAdminUnlocked) return;
            const current = stateRef.current;
            const target = current.accounts.find((a) => a.id === userId);
            if (!target) return;
            const nextFrozen = !target.isFrozen;
            const entry = {
              id: `aud_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              action: nextFrozen ? 'ACCOUNT_FROZEN' : 'ACCOUNT_UNFROZEN',
              targetUserName: target.name,
              details: nextFrozen
                ? 'تم تجميد الحساب ومنعه من طلب الشحن أو التحليل'
                : 'تم إعادة تفعيل الحساب',
              timestamp: new Date().toISOString(),
            };
            const next = {
              ...current,
              accounts: current.accounts.map((a) =>
                a.id === userId ? { ...a, isFrozen: nextFrozen } : a
              ),
              auditLog: [entry, ...current.auditLog],
            };
            writeOrdersSnapshotToStorage(next);
            setState(next);

            void (async () => {
              await syncAccountBalanceToFirestore(
                target,
                target.balance,
                nextFrozen
              );
              await syncAuditLogToFirestore(entry);
            })();
          },
          [isAdminUnlocked]
        );

        const adjustBalanceByAdmin = useCallback(
          (userId, delta, reason) => {
            if (!isAdminUnlocked) return;
            const current = stateRef.current;
            const target = current.accounts.find((a) => a.id === userId);
            if (!target) return;
            const nextBalance = Math.max(0, target.balance + delta);
            const entry = {
              id: `aud_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
              action: 'BALANCE_ADJUSTED',
              targetUserName: target.name,
              amount: delta,
              details: `${delta >= 0 ? 'إضافة' : 'خصم'} ${Math.abs(delta)} نقطة بقرار إداري (${reason || 'تعديل مباشر'})`.slice(
                0,
                400
              ),
              timestamp: new Date().toISOString(),
            };
            const next = {
              ...current,
              accounts: current.accounts.map((a) =>
                a.id === userId ? { ...a, balance: nextBalance } : a
              ),
              auditLog: [entry, ...current.auditLog],
            };
            writeOrdersSnapshotToStorage(next);
            setState(next);

            void (async () => {
              await syncAccountBalanceToFirestore(
                target,
                nextBalance,
                target.isFrozen
              );
              await syncAuditLogToFirestore(entry);
            })();
          },
          [isAdminUnlocked]
        );

        const placeBet = useCallback(
          (amount) => {
            if (!activeUser) return { ok: false, error: 'لا يوجد حساب نشط.' };
            if (activeUser.isFrozen) {
              return {
                ok: false,
                error: 'الحساب مجمد حالياً من قبل الإدارة.',
              };
            }
            if (!Number.isFinite(amount) || amount < 100) {
              return { ok: false, error: 'الحد الأدنى للرهان هو 100 جنيه.' };
            }
            if (activeUser.balance < amount) {
              return {
                ok: false,
                error: `رصيدك الحالي (${activeUser.balance} جنيه) غير كافٍ. أرسل طلب شحن وانتظر موافقة المالك.`,
              };
            }
            const nextBalance = activeUser.balance - Math.floor(amount);
            setState((prev) => ({
              ...prev,
              accounts: prev.accounts.map((a) =>
                a.id === activeUser.id ? { ...a, balance: nextBalance } : a
              ),
            }));
            void syncAccountBalanceToFirestore(
              activeUser,
              nextBalance,
              activeUser.isFrozen
            );
            return { ok: true };
          },
          [activeUser]
        );

        const cashOutBet = useCallback(
          (payoutAmount) => {
            if (!activeUser || payoutAmount <= 0) return;
            const rounded = Math.round(payoutAmount);
            const nextBalance = activeUser.balance + rounded;
            setState((prev) => ({
              ...prev,
              accounts: prev.accounts.map((a) =>
                a.id === activeUser.id ? { ...a, balance: nextBalance } : a
              ),
            }));
            void syncAccountBalanceToFirestore(
              activeUser,
              nextBalance,
              activeUser.isFrozen
            );
          },
          [activeUser]
        );

        const recordCompletedRound = useCallback((round) => {
          setState((prev) => {
            const updatedPredictions = prev.predictions.map((pred) => {
              if (
                pred.roundNumber === round.roundNumber &&
                pred.outcome === 'pending'
              ) {
                const hit = round.crashPoint >= pred.safeExit;
                return {
                  ...pred,
                  actualMultiplier: round.crashPoint,
                  outcome: hit ? 'hit' : 'missed',
                };
              }
              return pred;
            });

            const dedupedRounds = prev.rounds.filter(
              (r) => r.roundNumber !== round.roundNumber
            );

            return {
              ...prev,
              rounds: [round, ...dedupedRounds].slice(0, 60),
              predictions: updatedPredictions,
            };
          });
        }, []);

        return {
          state,
          activeUser,
          isAuthenticated,
          sessionRole: state.sessionRole,
          pendingCount,
          isAdminUnlocked,
          loginPlayer,
          registerPlayer,
          loginAsOwner,
          logout,
          switchUser,
          submitTopUpRequest,
          submitWithdrawRequest,
          unlockAdmin,
          lockAdmin,
          updateAdminPin,
          approveTopUpRequest,
          rejectTopUpRequest,
          approveWithdrawRequest,
          rejectWithdrawRequest,
          toggleFreezeAccount,
          adjustBalanceByAdmin,
          placeBet,
          cashOutBet,
          recordCompletedRound,
          refreshFromStorage,
        };
      }

      function drawGoldPlaneSkin(ctx, x, y, angle, isFlying, timeMs) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        if (isFlying) {
          const flicker = 0.45 + Math.sin(timeMs * 0.035) * 0.2;
          ctx.beginPath();
          ctx.moveTo(-22, -2);
          ctx.lineTo(-48, -6);
          ctx.lineTo(-40, 0);
          ctx.lineTo(-48, 6);
          ctx.lineTo(-22, 2);
          ctx.closePath();
          ctx.fillStyle = `rgba(245, 197, 24, ${flicker})`;
          ctx.fill();
        }

        ctx.beginPath();
        ctx.moveTo(26, 0);
        ctx.quadraticCurveTo(20, -5, 8, -5);
        ctx.lineTo(-4, -22);
        ctx.lineTo(-12, -22);
        ctx.lineTo(-5, -5);
        ctx.lineTo(-18, -4);
        ctx.lineTo(-25, -13);
        ctx.lineTo(-30, -13);
        ctx.lineTo(-24, -1);
        ctx.lineTo(-24, 1);
        ctx.lineTo(-30, 13);
        ctx.lineTo(-25, 13);
        ctx.lineTo(-18, 4);
        ctx.lineTo(-5, 5);
        ctx.lineTo(-12, 22);
        ctx.lineTo(-4, 22);
        ctx.lineTo(8, 5);
        ctx.quadraticCurveTo(20, 5, 26, 0);
        ctx.closePath();

        ctx.fillStyle = '#F5C518';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(20, 0);
        ctx.lineTo(-16, -2);
        ctx.lineTo(-16, 1);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fill();

        ctx.restore();
      }

      const FlightRadarCanvas = ({
        phase,
        multiplier,
        countdownSeconds,
        roundNumber,
        activePrediction,
        targetStopMultiplier,
        activeSlotLabel,
      }) => {
        const canvasRef = useRef(null);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          const width = Math.max(300, rect.width);
          const height = Math.max(168, rect.height);

          if (
            canvas.width !== Math.floor(width * dpr) ||
            canvas.height !== Math.floor(height * dpr)
          ) {
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
          }

          ctx.save();
          ctx.scale(dpr, dpr);

          ctx.fillStyle = '#131D36';
          ctx.fillRect(0, 0, width, height);

          const originX = Math.max(width * 0.52, 155);
          const originY = height - 26;
          const glow = ctx.createRadialGradient(
            width * 0.5,
            height * 0.5,
            10,
            width * 0.5,
            height * 0.5,
            width * 0.65
          );
          if (phase === 'CRASHED') {
            glow.addColorStop(0, 'rgba(225, 29, 72, 0.14)');
            glow.addColorStop(1, 'rgba(19, 29, 54, 0)');
          } else {
            glow.addColorStop(0, 'rgba(245, 197, 24, 0.08)');
            glow.addColorStop(1, 'rgba(19, 29, 54, 0)');
          }
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, width, height);

          const guideMultiplier =
            targetStopMultiplier ??
            (activePrediction && activePrediction.roundNumber === roundNumber
              ? activePrediction.safeExit
              : null);

          if (guideMultiplier) {
            const normTarget = Math.min(
              1,
              Math.log(Math.max(1.05, guideMultiplier)) / Math.log(14)
            );
            const targetY = originY - normTarget * (height - 70);
            ctx.save();
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle =
              multiplier >= guideMultiplier && phase !== 'CRASHED'
                ? 'rgba(16, 185, 129, 0.7)'
                : 'rgba(245, 197, 24, 0.45)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(24, targetY);
            ctx.lineTo(width - 24, targetY);
            ctx.stroke();
            ctx.restore();
          }

          const nowMs = performance.now();

          if (phase === 'WAITING') {
            drawGoldPlaneSkin(
              ctx,
              width - 58,
              Math.round(height * 0.44),
              -0.55,
              false,
              nowMs
            );
          }

          if (phase === 'FLYING' || phase === 'CRASHED') {
            const progress = Math.min(
              0.95,
              Math.log(Math.max(1, multiplier)) / Math.log(12) + 0.14
            );
            const endX = originX + progress * (width - originX - 44);
            const curveLift = Math.min(0.86, Math.pow(progress, 1.2));
            const endY = originY - curveLift * (height - 62);

            const cpX = originX + (endX - originX) * 0.55;
            const cpY = originY - (originY - endY) * 0.16;

            const areaGrad = ctx.createLinearGradient(0, endY, 0, originY);
            areaGrad.addColorStop(
              0,
              phase === 'CRASHED'
                ? 'rgba(225, 29, 72, 0.20)'
                : 'rgba(245, 197, 24, 0.16)'
            );
            areaGrad.addColorStop(1, 'rgba(19, 29, 54, 0.0)');

            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.quadraticCurveTo(cpX, cpY, endX, endY);
            ctx.lineTo(endX, originY);
            ctx.closePath();
            ctx.fillStyle = areaGrad;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.quadraticCurveTo(cpX, cpY, endX, endY);
            ctx.strokeStyle = phase === 'CRASHED' ? '#FB7185' : '#F5C518';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.stroke();

            if (phase === 'FLYING') {
              const dx = endX - cpX;
              const dy = endY - cpY;
              const angle = Math.atan2(dy, dx);
              drawGoldPlaneSkin(ctx, endX, endY, angle, true, nowMs);
            }
          }

          ctx.restore();
        }, [phase, multiplier, activePrediction, roundNumber, targetStopMultiplier]);

        const guideTarget =
          targetStopMultiplier ??
          (activePrediction && activePrediction.roundNumber === roundNumber
            ? activePrediction.safeExit
            : null);

        const hitSafeTarget =
          guideTarget !== null && multiplier >= guideTarget;

        return (
          <div className="relative overflow-hidden rounded-2xl border border-[#243252] bg-[#131D36]">
            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-[#243252] px-4 py-1.5 text-[11px] sm:text-xs text-slate-400">
              <div className="flex items-center gap-2">
                <span className="font-mono font-semibold text-slate-200 tabular-nums">
                  جولة #{roundNumber}
                </span>
                {activeSlotLabel && (
                  <>
                    <span aria-hidden="true">·</span>
                    <span className="font-semibold text-[#F5C518]">
                      {activeSlotLabel}
                    </span>
                  </>
                )}
              </div>

              {guideTarget && (
                <span className="text-slate-300">
                  هدف التوقف:{' '}
                  <strong className="font-mono text-[#F5C518] tabular-nums">
                    {guideTarget.toFixed(2)}x
                  </strong>
                </span>
              )}
            </div>

            <div className="relative h-[168px] sm:h-[205px] w-full">
              <canvas
                ref={canvasRef}
                className="block h-full w-full"
                aria-label="شاشة طيران الطيار والمضاعف"
              />

              <div className="pointer-events-none absolute inset-y-0 left-0 flex w-[58%] sm:w-[54%] flex-col items-center justify-center px-3 text-center">
                {phase === 'WAITING' && (
                  <>
                    <p className="font-mono text-3xl sm:text-5xl font-extrabold text-[#F5C518] tabular-nums">
                      {countdownSeconds.toFixed(1)}s
                    </p>
                    <p className="mt-1.5 text-xs sm:text-sm font-medium text-slate-300">
                      تجهيز إقلاع الطائرة
                    </p>
                  </>
                )}

                {phase === 'FLYING' && (
                  <>
                    <p
                      className={`font-mono text-5xl sm:text-6xl font-extrabold tracking-tight tabular-nums ${
                        hitSafeTarget ? 'text-emerald-400' : 'text-[#F5C518]'
                      }`}
                    >
                      {multiplier.toFixed(2)}x
                    </p>
                    {hitSafeTarget && (
                      <p className="mt-1.5 text-xs sm:text-sm font-semibold text-emerald-300">
                        تم الوصول لنقطة التوقف المختارة
                      </p>
                    )}
                  </>
                )}

                {phase === 'CRASHED' && (
                  <>
                    <p className="text-xs sm:text-sm font-semibold text-rose-300">
                      توقفت عند
                    </p>
                    <p className="mt-1 font-mono text-4xl sm:text-6xl font-extrabold text-rose-500 tabular-nums">
                      {multiplier.toFixed(2)}x
                    </p>
                  </>
                )}
              </div>
            </div>
          </div>
        );
      };

      const SLOT_LABELS = ['دور 1', 'دور 2', 'دور 3', 'دور 4', 'دور 5'];
      const QUICK_STAKES = [100, 200, 300, 400, 500, 1000];

      function generateRoundPlayers() {
        const ratios = [
          0.16, 0.25, 0.33, 0.42, 0.51, 0.59, 0.67, 0.75, 0.83, 0.91,
        ].map((base) =>
          Math.min(
            0.95,
            Math.max(0.1, Number((base + (Math.random() - 0.5) * 0.07).toFixed(2)))
          )
        );

        return ratios.map((ratio) => {
          const digitsCount = Math.random() < 0.45 ? 4 : 5;
          const minPrefix = digitsCount === 4 ? 1000 : 10000;
          const maxPrefix = digitsCount === 4 ? 8999 : 89999;
          const prefix = Math.floor(minPrefix + Math.random() * maxPrefix);

          const tierRoll = Math.random();
          let bet;
          if (tierRoll < 0.35) {
            bet = Math.floor(150 + Math.random() * 850);
          } else if (tierRoll < 0.75) {
            bet = Math.floor(1000 + Math.random() * 2200);
          } else {
            bet = Math.floor(3200 + Math.random() * 3300);
          }

          return {
            id: `${prefix}*****`,
            bet,
            ratio,
          };
        });
      }

      const HomePage = ({
        activeUser,
        phase,
        multiplier,
        countdownSeconds,
        batchSlots,
        activeSlotIndex,
        selectedStopSlotIndex,
        stakeInput,
        activeBetAmount,
        cashedOutAt,
        cashedOutPayout,
        betError,
        betNotice,
        onSelectStopSlot,
        onStakeChange,
        onPlaceBet,
        onCashOut,
      }) => {
        const activeSlot = batchSlots[activeSlotIndex] ?? batchSlots[0];

            : null;

        const targetStopMultiplier = selectedStopSlot
          ? Math.max(
              1.1,
              Number((selectedStopSlot.predictedCrash * 0.9).toFixed(2))
            )

        const canCashOut =
          phase === 'FLYING' && activeBetAmount !== null && cashedOutAt === null;
        const livePayout = canCashOut
          ? Math.round(activeBetAmount * multiplier)
          : 0;

        const displayedProfit = canCashOut
          ? livePayout.toFixed(2)
          : cashedOutPayout !== null
          ? cashedOutPayout.toFixed(2)
          : '0.00';

        const canPlaceBet =
          !activeUser.isFrozen &&
          activeBetAmount === null &&
          (phase === 'WAITING' || phase === 'CRASHED');

        const simulatedPlayers = useMemo(() => {
          void activeSlot.roundNumber;
          return generateRoundPlayers();
        }, [activeSlot.roundNumber]);

        const roundBaseStats = useMemo(() => {
          void activeSlot.roundNumber;
          const betsCount = Math.floor(340 + Math.random() * 340);
          const totalWagered = Math.floor(54000 + Math.random() * 92000);
          const totalProfit = Number(
            (totalWagered * (1.35 + Math.random() * 1.45)).toFixed(1)

          return { betsCount, totalWagered, totalProfit };
        }, [activeSlot.roundNumber]);

        const roundStats = {
          baseBetsCount:
            roundBaseStats.betsCount + (activeBetAmount !== null ? 1 : 0),
          totalWagered:
            roundBaseStats.totalWagered + (activeBetAmount ?? 0),
          totalProfit: roundBaseStats.totalProfit + (cashedOutPayout ?? 0),
        };

        return (
          <div className="mx-auto max-w-[920px] space-y-3">
            <section aria-label="جولات الطيار الخمس">

                      className={`flex flex-col items-center justify-center rounded-xl border py-1.5 px-1 sm:py-2 sm:px-2.5 text-center transition-colors ${
                        isActive
                          ? 'border-[#3B82F6] bg-[#162752]'
                          : isSelectedStop
                          ? 'border-[#F5C518] bg-[#1A2544]'
                          : isCompleted
                          ? 'border-[#1E2A4A] bg-[#0F172A] opacity-55'
                          : 'border-[#243252] bg-[#131D36] hover:border-[#3B82F6]/60'
                      }`}
                    >
                      <span className="text-[10px] sm:text-xs font-semibold text-slate-300 leading-tight">
                        {SLOT_LABELS[index]}
                      </span>
                      <span className="mt-0.5 font-mono text-xs sm:text-base font-extrabold text-[#F5C518] tabular-nums leading-tight">
                        {slot.predictedCrash.toFixed(2)}x
                      </span>
                      <span className="mt-0.5 text-[9px] sm:text-[10px] font-medium text-slate-400 leading-tight">
                        {isSelectedStop
                          ? 'توقف'
                          : isActive
                          ? 'الحالي'
                          : isCompleted
                          ? 'انتهى'
                          : 'قادم'}
                      </span>
                    </button>
                  );
                })}
              </div>
            </section>

                  ? targetStopMultiplier

              }

            />

            <section className="rounded-2xl border border-[#243252] bg-[#131D36] p-3 sm:p-4 space-y-2.5">
              <div className="grid grid-cols-12 gap-2.5 items-center">
                <div className="col-span-8 space-y-1">
                  <div className="flex items-center justify-between text-[11px] sm:text-xs">
                    <label

        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const renderAt = (maxDim, quality) => {
                const scale = Math.min(
                  1,
                  maxDim / Math.max(img.width, img.height)
                );
                const width = Math.max(1, Math.round(img.width * scale));
                const height = Math.max(1, Math.round(img.height * scale));
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                if (!ctx) return String(reader.result);
                ctx.drawImage(img, 0, 0, width, height);
                return canvas.toDataURL('image/jpeg', quality);
              };

              let output = renderAt(720, 0.72);
              if (output.length > 650000) output = renderAt(520, 0.55);
              if (output.length > 850000) output = renderAt(380, 0.45);
              resolve(output);
            };
            img.onerror = () => resolve(String(reader.result));
            img.src = String(reader.result);
          };
          reader.onerror = () => reject(new Error('تعذر قراءة الصورة.'));
          reader.readAsDataURL(file);
        });

            if (Array.isArray(parsed.registrationRequests)) {
              for (const item of parsed.registrationRequests) {
                if (item?.id) map.set(item.id, item);
              }
            }
          }
        } catch {}
        for (const item of cloudRegs) {
          if (item?.id) map.set(item.id, item);
        }
        return Array.from(map.values()).sort((a, b) =>
          b.createdAt.localeCompare(a.createdAt)
        );

          slotIndex,
          roundNumber: startRoundNumber + slotIndex,
          predictedCrash: generateSimulatedCrashPoint(),
          status: slotIndex === 0 ? 'active' : 'upcoming',
        }));
      }

      function App() {
        const {
          state,
          activeUser,
          isAuthenticated,
          sessionRole,
          isAdminUnlocked,
          loginPlayer,
          registerPlayer,
          loginAsOwner,
          logout,
          switchUser,
          submitTopUpRequest,
          submitWithdrawRequest,
          unlockAdmin,
          lockAdmin,
          updateAdminPin,
          approveTopUpRequest,
          rejectTopUpRequest,
          approveWithdrawRequest,
          rejectWithdrawRequest,
          toggleFreezeAccount,
          adjustBalanceByAdmin,
          placeBet,
          cashOutBet,
          recordCompletedRound,
          refreshFromStorage,
        } = useAppStore();

        const initialStartRound = (state.rounds[0]?.roundNumber ?? 1040) + 1;

        const [activeTab, setActiveTab] = useState('home');
        const [authInitialMode, setAuthInitialMode] = useState('login');
        const [phase, setPhase] = useState('WAITING');
        const [multiplier, setMultiplier] = useState(1.0);
        const [countdownSeconds, setCountdownSeconds] =
          useState(WAITING_DURATION_SEC);

        const [batchSlots, setBatchSlots] = useState(() =>
          createFiveRoundBatch(initialStartRound)
        );
        const [activeSlotIndex, setActiveSlotIndex] = useState(0);
        const [selectedStopSlotIndex, setSelectedStopSlotIndex] = useState(0);
        const [stakeInput, setStakeInput] = useState(100);
        const [activeBetAmount, setActiveBetAmount] = useState(null);
        const [cashedOutAt, setCashedOutAt] = useState(null);
        const [cashedOutPayout, setCashedOutPayout] = useState(null);
        const [betError, setBetError] = useState(null);
        const [betNotice, setBetNotice] = useState(null);

        const currentSlot = batchSlots[activeSlotIndex] ?? batchSlots[0];
        const currentRoundNumber = currentSlot.roundNumber;

        const rafRef = useRef(null);
        const batchRef = useRef(batchSlots);
        const slotIdxRef = useRef(activeSlotIndex);
        const selectedStopRef = useRef(selectedStopSlotIndex);
        const activeBetRef = useRef(activeBetAmount);
        const cashedOutRef = useRef(cashedOutAt);

        useEffect(() => {
          batchRef.current = batchSlots;
        }, [batchSlots]);
        useEffect(() => {
          slotIdxRef.current = activeSlotIndex;
        }, [activeSlotIndex]);
        useEffect(() => {
          selectedStopRef.current = selectedStopSlotIndex;
        }, [selectedStopSlotIndex]);
        useEffect(() => {
          activeBetRef.current = activeBetAmount;
        }, [activeBetAmount]);
        useEffect(() => {
          cashedOutRef.current = cashedOutAt;
        }, [cashedOutAt]);

        const handleCashOutInternal = useCallback(
          (atMultiplier, isAuto) => {
            const stake = activeBetRef.current;
            if (stake === null || cashedOutRef.current !== null) return;
            const payout = Math.round(stake * atMultiplier);
            cashedOutRef.current = atMultiplier;
            setCashedOutAt(atMultiplier);
            setCashedOutPayout(payout);
            cashOutBet(payout);
            soundEngine.playSuccess();
            setBetError(null);
            setBetNotice(
              isAuto
                ? `تم السحب التلقائي عند نقطة التوقف (${atMultiplier.toFixed(2)}x) — أرباحك: ${payout.toLocaleString('en-US')} جنيه`
                : `تم سحب الأرباح بنجاح عند ${atMultiplier.toFixed(2)}x — أضيف لرصيدك ${payout.toLocaleString('en-US')} جنيه`
            );
          },
          [cashOutBet]
        );

        const startFlight = useCallback(() => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);

          const idx = slotIdxRef.current;
          const slot = batchRef.current[idx] ?? batchRef.current[0];
          const target = slot.predictedCrash;
          const roundNum = slot.roundNumber;

          const isChosenStopRound = selectedStopRef.current === idx;
          const autoStopTarget = isChosenStopRound
            ? Math.max(1.1, Number((target * 0.9).toFixed(2)))
            : null;

          setPhase('FLYING');
          setMultiplier(1.0);
          setCashedOutAt(null);
          setCashedOutPayout(null);
          cashedOutRef.current = null;

          const startTime = performance.now();

          const tick = (now) => {
            const elapsedSec = (now - startTime) / 1000;
            const currentMult = Number(Math.exp(0.13 * elapsedSec).toFixed(2));

            if (
              autoStopTarget !== null &&
              activeBetRef.current !== null &&
              cashedOutRef.current === null &&
              currentMult >= autoStopTarget &&
              currentMult < target
            ) {
              handleCashOutInternal(autoStopTarget, true);
            }

            if (currentMult >= target) {
              setMultiplier(target);
              setPhase('CRASHED');
              soundEngine.playCrash();

              if (activeBetRef.current !== null && cashedOutRef.current === null) {
                setBetNotice(null);
                setBetError(
                  `انفجرت الطائرة عند ${target.toFixed(2)}x قبل سحب الرهان.`
                );
              }

              recordCompletedRound({
                roundNumber: roundNum,
                crashPoint: target,
                hashSeed: generateRoundSeed(),
                timestamp: new Date().toISOString(),
              });
              return;
            }

            setMultiplier(currentMult);
            rafRef.current = requestAnimationFrame(tick);
          };

          rafRef.current = requestAnimationFrame(tick);
        }, [handleCashOutInternal, recordCompletedRound]);

        useEffect(() => {
          if (!isAuthenticated) return;

          if (phase === 'WAITING') {
            const interval = window.setInterval(() => {
              setCountdownSeconds((prev) => {
                if (prev <= 0.1) {
                  window.clearInterval(interval);
                  startFlight();
                  return 0;
                }
                return Number((prev - 0.1).toFixed(1));
              });
            }, 100);
            return () => window.clearInterval(interval);
          }

          if (phase === 'CRASHED') {
            const timeout = window.setTimeout(() => {
              const currentIdx = slotIdxRef.current;

              setActiveBetAmount(null);
              activeBetRef.current = null;
              setCashedOutAt(null);
              cashedOutRef.current = null;
              setCashedOutPayout(null);

              if (currentIdx >= 4) {
                const lastRoundNum =
                  batchRef.current[4]?.roundNumber ?? currentRoundNumber;
                setBatchSlots(createFiveRoundBatch(lastRoundNum + 1));
                setActiveSlotIndex(0);
                setSelectedStopSlotIndex(0);
              } else {
                const nextIdx = currentIdx + 1;
                setBatchSlots((prev) =>
                  prev.map((slot, idx) => ({
                    ...slot,
                    status:
                      idx < nextIdx
                        ? 'completed'
                        : idx === nextIdx
                        ? 'active'
                        : 'upcoming',
                  }))
                );
                setActiveSlotIndex(nextIdx);
              }

              setPhase('WAITING');
              setMultiplier(1.0);
              setCountdownSeconds(WAITING_DURATION_SEC);
            }, 2200);
            return () => window.clearTimeout(timeout);
          }
        }, [isAuthenticated, phase, startFlight, currentRoundNumber]);

        useEffect(() => {
          return () => {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
          };
        }, []);

        const openAuthAtMode = (mode) => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          setPhase('WAITING');
          setMultiplier(1.0);
          setCountdownSeconds(WAITING_DURATION_SEC);
          setActiveBetAmount(null);
          setBetError(null);
          setAuthInitialMode(mode);
          setActiveTab('home');
          logout();
        };

        if (!isAuthenticated) {
          return (
            <AuthPage
              initialMode={authInitialMode}
              onLoginPlayer={(phone, password) => {
                const res = loginPlayer(phone, password);
                if (res.ok) setActiveTab('home');
                return res;
              }}
              onRegisterPlayer={(name, phone, password) => {
                const res = registerPlayer(name, phone, password);
                if (res.ok) setActiveTab('home');
                return res;
              }}
              onLoginOwner={(pin) => {
                const res = loginAsOwner(pin);
                if (res.ok) setActiveTab('admin');
                return res;
              }}
            />
          );
        }

        const handlePlaceBet = () => {
          setBetError(null);
          setBetNotice(null);
          if (activeBetAmount !== null) return;

          const res = placeBet(stakeInput);
          if (!res.ok) {
            setBetError(res.error || 'تعذر تنفيذ الرهان.');
            return;
          }

          const cleanStake = Math.floor(stakeInput);
          setActiveBetAmount(cleanStake);
          activeBetRef.current = cleanStake;
          setCashedOutAt(null);
          setCashedOutPayout(null);
          setBetNotice(
            `تم تأكيد رهانك بمبلغ ${cleanStake.toLocaleString('en-US')} جنيه على هذه الجولة.`
          );
          soundEngine.playSignalReady();
        };

        const handleCashOutClick = () => {
          if (
            phase !== 'FLYING' ||
            activeBetAmount === null ||
            cashedOutAt !== null
          ) {
            return;
          }
          handleCashOutInternal(multiplier, false);
        };

        const activeUserRequests = state.topUpRequests.filter(
          (r) => r.userId === activeUser.id
        );
        const activeUserWithdrawRequests = state.withdrawRequests.filter(
          (r) => r.userId === activeUser.id
        );

        const safeActiveTab =
          activeTab === 'admin' && sessionRole !== 'admin' ? 'home' : activeTab;

        return (
          <div className="min-h-screen flex flex-col bg-[#0B1221] text-slate-100">
            <TopBar
              balance={activeUser.balance}
              userName={activeUser.name}
              userPhone={activeUser.phone}
              onSelectTab={(tab) => {
                if (tab === 'admin' && sessionRole !== 'admin') return;
                setActiveTab(tab);
              }}
              onOpenTopUp={() => setActiveTab('topup')}
              onOpenWithdraw={() => setActiveTab('withdraw')}
              onOpenAuthMode={openAuthAtMode}
              onTriggerOwnerAuth={() => openAuthAtMode('owner')}
              onLogout={() => openAuthAtMode('login')}
            />

            {sessionRole === 'admin' && (
              <AccountBar
                accounts={state.accounts}
                activeUser={activeUser}
                sessionRole={sessionRole}
                onSwitchUser={(id) => {
                  switchUser(id);
                  setBetError(null);
                }}
                onOpenAuthMode={openAuthAtMode}
                onOpenAdminPanel={() => setActiveTab('admin')}
              />
            )}

            <main className="flex-1 px-3 py-3 sm:px-6 sm:py-5">
              {safeActiveTab === 'home' && (
                <HomePage
                  activeUser={activeUser}
                  phase={phase}
                  multiplier={multiplier}
                  countdownSeconds={countdownSeconds}
                  batchSlots={batchSlots}
                  activeSlotIndex={activeSlotIndex}
                  selectedStopSlotIndex={selectedStopSlotIndex}
                  stakeInput={stakeInput}
                  activeBetAmount={activeBetAmount}
                  cashedOutAt={cashedOutAt}
                  cashedOutPayout={cashedOutPayout}
                  betError={betError}
                  betNotice={betNotice}
                  onSelectStopSlot={(idx) => setSelectedStopSlotIndex(idx)}
                  onStakeChange={(val) => {
                    setStakeInput(val);
                    setBetError(null);
                  }}
                  onPlaceBet={handlePlaceBet}
                  onCashOut={handleCashOutClick}
                />
              )}

              {safeActiveTab === 'topup' && (
                <TopUpView
                  activeUser={activeUser}
                  userRequests={activeUserRequests}
                  onSubmitRequest={submitTopUpRequest}
                  onBackHome={() => setActiveTab('home')}
                />
              )}

              {safeActiveTab === 'withdraw' && (
                <WithdrawView
                  activeUser={activeUser}
                  userRequests={activeUserWithdrawRequests}
                  onSubmitWithdraw={submitWithdrawRequest}
                  onBackHome={() => setActiveTab('home')}
                />
              )}

              {safeActiveTab === 'admin' && sessionRole === 'admin' && (
                <AdminApprovalPanel
                  isUnlocked={isAdminUnlocked}
                  registrationRequests={state.registrationRequests}
                  requests={state.topUpRequests}
                  withdrawRequests={state.withdrawRequests}
                  accounts={state.accounts}
                  auditLog={state.auditLog}
                  onUnlock={unlockAdmin}
                  onLock={lockAdmin}
                  onApprove={approveTopUpRequest}
                  onReject={rejectTopUpRequest}
                  onApproveWithdraw={approveWithdrawRequest}
                  onRejectWithdraw={rejectWithdrawRequest}
                  onToggleFreeze={toggleFreezeAccount}
                  onAdjustBalance={adjustBalanceByAdmin}
                  onUpdatePin={updateAdminPin}
                  onRefreshFromStorage={refreshFromStorage}
                />
              )}
            </main>

            <footer className="border-t border-[#1E2A4A] bg-[#0B1221] px-4 py-5 sm:px-8">
              <div className="mx-auto flex max-w-[1440px] flex-wrap items-center justify-between gap-4 text-xs text-slate-500">
                <span>سكريبت الطيارة — بيئة محاكاة وتحليل إحصائي</span>
                <span>جميع عمليات شحن الرصيد تخضع لمراجعة وموافقة مالك النظام</span>
              </div>
            </footer>
          </div>
        );
      }

      createRoot(document.getElementById('root')).render(
        <React.StrictMode>
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        </React.StrictMode>
      );
    </script>
  </body>
</html>
